services:
  wifi-config:
    container_name: wifi-config
    restart: unless-stopped
    ports:
      - "0.0.0.0:8090:8090"
    volumes:
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    ${BUILD_LOCAL:+build:}
    ${BUILD_LOCAL:+  context: ./app}
    ${BUILD_LOCAL:+  dockerfile: Dockerfile}
    ${BUILD_LOCAL:-image: id0ntplaygam3s/rpi-wifi-config:latest}
